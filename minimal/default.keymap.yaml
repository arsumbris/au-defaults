# Keyboard shortcuts for the minimal composition. Remove its keymap reference to disable them.
# `mod` is Command on macOS and Control elsewhere. The composition declares the intent dependency.
type: keymap::au-host-sdk
keybinds:
  - chord:
      - mods: [mod]
        key: s
    intent: "[[save-intent::intent]]"
  - chord:
      - mods: [mod]
        key: k
    intent: "[[toggle-command-palette-intent::intent]]"
  - chord:
      - mods: [mod]
        key: w
    intent: "[[close-view-intent::intent]]"
